<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem("mythicalBlueThemeMode")||"daylight";}catch(e){document.documentElement.dataset.theme="daylight";}})();</script>
  <title>Mythical Blue · Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/accessibility.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/theme-mode.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: "#2b3866",
            "navy-deep": "#1c2750",
            gold: "#b8902c",
            "gold-deep": "#8a6918",
            ink: "#1f2952",
            moon: {
              surface: "#122342",
              text: "#eef6ff",
              accent: "#95ccff",
              line: "rgba(146, 203, 255, .42)"
            }
          },
          fontFamily: {
            display: ["Cinzel Decorative", "serif"],
            title: ["Cinzel", "serif"],
            body: ["Lora", "Georgia", "serif"]
          },
          boxShadow: {
            parchment: "0 10px 38px rgba(0, 0, 0, .38), 0 2px 10px rgba(0, 0, 0, .22)",
            moon: "0 12px 42px rgba(0,0,0,.52), 0 0 18px rgba(96,184,255,.14), inset 0 0 0 1px rgba(205,238,255,.08)"
          }
        }
      }
    };
  </script>
  <style>
    body.admin-body {
      min-height: 100vh;
      padding: 28px 14px;
    }

    .admin-card {
      background-color: #ede1c0;
      background-image: url("assets/parchment-seamless.png");
      background-size: 100% auto;
      background-repeat: repeat-y;
      color: var(--ink);
    }

    .admin-card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(184, 144, 44, .36);
      pointer-events: none;
    }

    html[data-theme="moonlight"] .admin-card {
      border-color: rgba(142, 215, 255, .92);
      background:
        linear-gradient(135deg, rgba(4, 27, 66, .90), rgba(8, 42, 89, .72)),
        url("assets/themes/moonlight/backgrounds/parchment-seamless.png");
      color: #eefaff;
      box-shadow: 0 12px 42px rgba(0,0,0,.52), 0 0 18px rgba(96,184,255,.14), inset 0 0 0 1px rgba(205,238,255,.08);
    }

    html[data-theme="moonlight"] .admin-card::before {
      border-color: rgba(164, 224, 255, .38);
    }

    html[data-theme="moonlight"] .admin-card h1,
    html[data-theme="moonlight"] .admin-card p,
    html[data-theme="moonlight"] .admin-card td,
    html[data-theme="moonlight"] .admin-card th {
      color: var(--moon-text);
    }

    html[data-theme="moonlight"] .admin-card .admin-accent {
      color: var(--moon-accent);
    }

    html[data-theme="moonlight"] .admin-card .admin-panel,
    html[data-theme="moonlight"] .admin-card .admin-table {
      border-color: var(--moon-line);
      background: var(--moon-surface-glass);
    }

    html[data-theme="moonlight"] .admin-card thead {
      border-color: var(--moon-line);
      background: rgba(84, 144, 212, .18);
    }

    html[data-theme="moonlight"] .admin-card tbody {
      border-color: var(--moon-line);
    }

    html[data-theme="moonlight"] .admin-card tr:hover {
      background: rgba(24, 49, 94, .76);
    }
  </style>
</head>
<body class="admin-body">
  <main class="mx-auto grid w-full max-w-5xl gap-4" aria-labelledby="adminTitle">
    <nav class="flex items-center justify-between gap-3">
      <a class="font-title text-sm font-bold uppercase tracking-wide text-[#f7ead0] underline decoration-[#d6a838]/60 underline-offset-4 hover:text-white" href="/">Back to Sheet</a>
      <button type="button" class="theme-toggle theme-toggle-compact" data-theme-toggle aria-label="Switch visual theme">
        <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-orb"></span></span>
        <span class="theme-toggle-label">Moonlight</span>
      </button>
    </nav>

    <section class="admin-card relative overflow-hidden border-2 border-gold p-5 shadow-parchment sm:p-7">
      <div class="relative z-[1] grid gap-7">
        <header class="grid justify-items-center gap-3 text-center">
          <img class="block h-auto w-[min(320px,88%)] drop-shadow" src="assets/title-banner.png" data-daylight-src="assets/title-banner.png" data-moonlight-src="assets/themes/moonlight/branding/title-banner.png" alt="Mythical Blue · The Great Depth" />
          <div>
            <p class="admin-accent font-title text-xs font-bold uppercase tracking-[0.24em] text-gold-deep">Captain's Ledger</p>
            <h1 id="adminTitle" class="font-display text-2xl text-navy-deep sm:text-3xl">Admin</h1>
          </div>
        </header>

        <div class="grid gap-3 sm:grid-cols-3">
          <article class="admin-panel border border-gold/70 bg-white/30 p-4 backdrop-blur-sm">
            <p class="font-title text-xs font-bold uppercase tracking-wide text-gold-deep">Signed In</p>
            <p class="mt-2 break-all font-body text-sm text-ink">{{.CurrentUser.Email}}</p>
          </article>
          <article class="admin-panel border border-gold/70 bg-white/30 p-4 backdrop-blur-sm sm:col-span-2">
            <p class="font-title text-xs font-bold uppercase tracking-wide text-gold-deep">Registered Users</p>
            <p class="mt-2 font-display text-4xl text-navy-deep">{{.UserCount}}</p>
          </article>
        </div>

        <section class="admin-table overflow-hidden border border-gold/70 bg-white/25">
          <div class="overflow-x-auto">
            <table class="min-w-full border-collapse text-left font-body text-sm">
              <thead class="border-b border-gold/70 bg-navy/10 font-title text-xs uppercase tracking-wide text-gold-deep">
                <tr>
                  <th class="px-4 py-3 font-bold">Email</th>
                  <th class="px-4 py-3 font-bold">User ID</th>
                  <th class="px-4 py-3 font-bold">Admin</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gold/40">
                {{range .Users}}
                <tr class="bg-white/10 hover:bg-white/30">
                  <td class="max-w-[280px] break-all px-4 py-3 text-ink">{{.Email}}</td>
                  <td class="min-w-[260px] px-4 py-3 font-mono text-xs text-ink/80">{{.ID}}</td>
                  <td class="px-4 py-3">
                    {{if .IsAdmin}}
                    <span class="inline-flex border border-gold bg-gold/20 px-2 py-1 font-title text-xs font-bold uppercase tracking-wide text-gold-deep">Yes</span>
                    {{else}}
                    <span class="inline-flex border border-ink/20 bg-white/20 px-2 py-1 font-title text-xs font-bold uppercase tracking-wide text-ink/70">No</span>
                    {{end}}
                  </td>
                </tr>
                {{else}}
                <tr>
                  <td class="px-4 py-8 text-center font-body text-ink/75" colspan="3">No registered users found.</td>
                </tr>
                {{end}}
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="js/theme-mode.js"></script>
</body>
</html>
