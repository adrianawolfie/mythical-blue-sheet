<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem("mythicalBlueThemeMode")||"daylight";}catch(e){document.documentElement.dataset.theme="daylight";}})();</script>
  <title>Mythical Blue · Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/accessibility.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/toast.css" />
  <link rel="stylesheet" href="css/theme-mode.css" />
</head>
<body class="login-body">
  <main class="login-shell" aria-labelledby="loginTitle">
    <section class="login-card">
      <div class="login-brand">
        <img src="assets/title-banner.png" data-daylight-src="assets/title-banner.png" data-moonlight-src="assets/themes/moonlight/branding/title-banner.png" alt="Mythical Blue · The Great Depth" />
        <h1 id="loginTitle">Crew Login</h1>
      </div>

      <form class="login-form" id="loginForm" action="/api/login" method="post">
        <label class="login-field">
          <span>Email</span>
          <input id="username" name="username" type="email" autocomplete="username" required />
        </label>

        <label class="login-field">
          <span>Password</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>

        <div class="login-actions">
          <button class="login-submit" type="submit">Log In</button>
          <a class="login-register" href="/register.html">Create Account</a>
        </div>

        <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="js/toast.js"></script>
  <script src="js/theme-mode.js"></script>
  <script>
    (() => {
      const form = document.getElementById("loginForm");
      const error = document.getElementById("loginError");
      const submit = form.querySelector("button[type='submit']");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        submit.disabled = true;

        try {
          const response = await fetch(form.action, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: form.username.value,
              password: form.password.value
            })
          });

          if (response.redirected) {
            window.location.assign(response.url);
            return;
          }

          if (response.ok) {
            window.location.assign("/");
            return;
          }

          if (response.status === 404) {
            window.showToast("No user found with that email or your password is incorrect.", { variant: "error" });
            return;
          }

          window.showToast("Login failed.", { variant: "error" });
        } catch {
          window.showToast("Login failed.", { variant: "error" });
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
