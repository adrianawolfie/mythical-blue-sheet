<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem("mythicalBlueThemeMode")||"daylight";}catch(e){document.documentElement.dataset.theme="daylight";}})();</script>
  <title>Mythical Blue · Set Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/accessibility.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/theme-mode.css" />
</head>
<body class="login-body">
  <main class="login-shell" aria-labelledby="resetTitle">
    <section class="login-card">
      <div class="login-brand">
        <img src="assets/title-banner.png" data-daylight-src="assets/title-banner.png" data-moonlight-src="assets/themes/moonlight/branding/title-banner.png" alt="Mythical Blue · The Great Depth" />
        <h1 id="resetTitle">Set a New Password</h1>
      </div>
      <p class="login-copy" id="resetMessage" role="status" aria-live="polite">Checking your reset link…</p>
      <form class="login-form" id="resetForm" hidden>
        <label class="login-field">
          <span>New Password</span>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required />
          <ul class="login-requirements" aria-label="Password requirements">
            <li class="login-requirement" data-requirement="length">At least 8 characters</li>
            <li class="login-requirement" data-requirement="number">Includes a number</li>
            <li class="login-requirement" data-requirement="special">Includes a special character</li>
            <li class="login-requirement" data-requirement="case">Includes lowercase and uppercase letters</li>
          </ul>
        </label>
        <label class="login-field">
          <span>Confirm Password</span>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
        </label>
        <div class="login-actions">
          <button class="login-submit" type="submit">Set Password</button>
          <a class="login-register" href="/login.html">Back to Login</a>
        </div>
      </form>
      <a class="login-register" id="requestLink" href="/forgot-password.html" hidden>Request another reset link</a>
      <a class="login-register" id="loginLink" href="/login.html" hidden>Go to Login</a>
    </section>
  </main>
  <script src="js/theme-mode.js"></script>
  <script src="js/api-client.js"></script>
  <script>
    (() => {
      const token = new URLSearchParams(window.location.search).get("token") || "";
      const form = document.getElementById("resetForm");
      const message = document.getElementById("resetMessage");
      const requestLink = document.getElementById("requestLink");
      const loginLink = document.getElementById("loginLink");
      const submit = form.querySelector("button[type='submit']");
      const passwordInput = document.getElementById("newPassword");
      const requirementEls = Array.from(document.querySelectorAll(".login-requirement"));
      window.history.replaceState({}, document.title, window.location.pathname);

      function getPasswordState(password) {
        return {
          length: password.length >= 8,
          number: /[0-9]/.test(password),
          special: /[^A-Za-z0-9]/.test(password),
          case: /[a-z]/.test(password) && /[A-Z]/.test(password)
        };
      }

      function validatePassword(password) {
        const state = getPasswordState(password);
        if (!state.length) return "Password must be at least 8 characters.";
        if (!state.number) return "Password must include a number.";
        if (!state.special) return "Password must include a special character.";
        if (!state.case) return "Password must include both lowercase and uppercase letters.";
        return "";
      }

      function updatePasswordRequirements() {
        const state = getPasswordState(passwordInput.value);
        requirementEls.forEach((el) => {
          el.classList.toggle("is-met", state[el.dataset.requirement] || false);
        });
      }

      updatePasswordRequirements();
      passwordInput.addEventListener("input", updatePasswordRequirements);

      const showInvalid = () => {
        message.textContent = "This reset link is invalid, expired, or has already been used.";
        requestLink.hidden = false;
      };

      (async () => {
        if (!token) {
          showInvalid();
          return;
        }
        try {
          const response = await window.apiFetch("/api/password-reset/validate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token })
          });
          if (!response.ok) {
            showInvalid();
            return;
          }
          message.textContent = "Choose a new password for your account.";
          form.hidden = false;
        } catch {
          message.textContent = "We couldn’t verify this reset link. Please try again.";
          requestLink.hidden = false;
        }
      })();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        const passwordError = validatePassword(form.newPassword.value);
        if (passwordError) {
          message.textContent = passwordError;
          return;
        }
        if (form.newPassword.value !== form.confirmPassword.value) {
          message.textContent = "The passwords do not match.";
          return;
        }
        submit.disabled = true;
        try {
          const response = await window.apiFetch("/api/password-reset/confirm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword: form.newPassword.value })
          });
          if (response.ok) {
            form.hidden = true;
            message.textContent = "Your password has been updated. You can now log in.";
            loginLink.hidden = false;
            return;
          }
          if (response.status === 400) {
            message.textContent = await response.text();
            if (message.textContent.includes("token")) {
              form.hidden = true;
              requestLink.hidden = false;
            }
            return;
          }
          message.textContent = "We couldn’t update your password. Please try again.";
        } catch {
          message.textContent = "We couldn’t update your password. Please try again.";
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
