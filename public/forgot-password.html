<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem("mythicalBlueThemeMode")||"daylight";}catch(e){document.documentElement.dataset.theme="daylight";}})();</script>
  <title>Mythical Blue · Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/accessibility.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/theme-mode.css" />
</head>
<body class="login-body">
  <main class="login-shell" aria-labelledby="forgotTitle">
    <section class="login-card">
      <div class="login-brand">
        <img src="assets/title-banner.png" data-daylight-src="assets/title-banner.png" data-moonlight-src="assets/themes/moonlight/branding/title-banner.png" alt="Mythical Blue · The Great Depth" />
        <h1 id="forgotTitle">Reset Your Password</h1>
      </div>
      <p class="login-copy">Enter the email address for your account. If it matches an account, we’ll send a password reset link.</p>
      <form class="login-form" id="forgotForm">
        <label class="login-field">
          <span>Email</span>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </label>
        <div class="login-actions">
          <button class="login-submit" type="submit">Send Reset Link</button>
          <a class="login-register" href="/login.html">Back to Login</a>
        </div>
        <p class="login-error" id="forgotMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="js/theme-mode.js"></script>
  <script src="js/api-client.js"></script>
  <script>
    (() => {
      const form = document.getElementById("forgotForm");
      const message = document.getElementById("forgotMessage");
      const submit = form.querySelector("button[type='submit']");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        submit.disabled = true;
        try {
          const response = await window.apiFetch("/api/password-reset/request", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: form.email.value })
          });
          if (!response.ok) throw new Error("request failed");
          message.textContent = "If an account uses that email, a reset link will arrive shortly.";
          form.reset();
        } catch {
          message.textContent = "We couldn’t submit your request. Please try again later.";
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
