<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <script src="/js/theme-init.js"></script>
  <title>Mythical Blue · Admin Characters</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/accessibility.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/toast.css" />
  <link rel="stylesheet" href="/css/theme-mode.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin-body">
  <main class="admin-shell" aria-labelledby="adminTitle">
    <nav class="admin-nav"><a class="admin-back-link" href="/">Back to Sheet</a></nav>
    <div class="admin-layout">
      <aside class="admin-sidebar"><div class="admin-sidebar-inner"><p class="admin-sidebar-title">Admin</p><nav class="admin-sidebar-nav"><a class="admin-sidebar-link" href="/admin/users.html">Users</a><a class="admin-sidebar-link active" href="/admin/characters.html">Characters</a><a class="admin-sidebar-link" href="/admin/campaigns.html">Campaigns</a></nav></div></aside>
      <section class="admin-card"><div class="admin-content"><header class="admin-header"><img src="/assets/title-banner.png" data-daylight-src="/assets/title-banner.png" data-moonlight-src="/assets/themes/moonlight/branding/title-banner.png" alt="Mythical Blue · The Great Depth" /><div><h1 id="adminTitle">Characters</h1></div></header><section class="admin-table"><div class="admin-table-scroll"><table><thead><tr><th>Name</th><th>Class</th><th>Level</th><th>User</th></tr></thead><tbody id="adminCharactersBody"><tr><td class="admin-empty" colspan="4">Loading characters...</td></tr></tbody></table></div></section></div></section>
    </div>
  </main>
  <div class="admin-modal" id="assignCharacterModal" hidden>
    <section class="admin-modal-card" role="dialog" aria-modal="true" aria-labelledby="assignCharacterTitle">
      <h2 id="assignCharacterTitle">Assign Character</h2>
      <p class="admin-modal-copy">Select the user who should own <strong id="assignCharacterName"></strong>.</p>
      <form id="assignCharacterForm">
        <label class="admin-modal-field">
          <span>User</span>
          <select id="assignCharacterUser" required></select>
        </label>
        <p class="admin-modal-error" id="assignCharacterError" role="alert" aria-live="polite"></p>
        <div class="admin-modal-actions">
          <button type="submit">Save</button>
          <button type="button" data-assign-cancel>Cancel</button>
        </div>
      </form>
    </section>
  </div>
  <script src="/js/toast.js"></script>
  <script src="/js/theme-mode.js"></script>
  <script src="/js/accessibility.js"></script>
  <script src="/js/account.js"></script>
  <script src="/admin/characters.js"></script>
</body>
</html>
